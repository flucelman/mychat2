syntax = "proto3"; // 版本声明，使用Protocol Buffers v3版本

option go_package = "./onlineSearch";
package onlineSearch; // 包名

// 定义服务
service Greeter {
    // SayHello 方法
    rpc OnlineSearch (SearchRequest) returns (SearchResponse) {}
}

// 请求消息
message SearchRequest {
    string keyWord = 1;
}

// 响应消息
message SearchResponse {
    string reply = 1;
}
